name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Millennium plugin (.star)
        run: npm run build

      - name: Build Tampermonkey userscript (.user.js)
        run: npm run build:userscript

      - name: Extract changelog for release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" dist/release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Market Batch Lister ${{ github.ref_name }}"
          body_path: dist/release-notes.md
          generate_release_notes: false
          files: |
            dist/com.steammarket.batchlister.star
            dist/steam-market-batch-lister.user.js
