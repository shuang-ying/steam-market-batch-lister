[plugin]
id = "com.steammarket.batchlister"
name = "Steam Market Batch Lister"
version = "1.1.0"
author = "shuang-ying"
description = "Steam 客户端原生市场批量上架插件，支持 CS2 / Dota 2 / TF2 / 通用库存，支持最低卖价、最低价-0.01、最高求购秒出与自定义价格。"

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
# 默认输出 .star 插件包到 dist/ 目录，方便查看和通过 scripts/install-millennium.ps1 安装；
# 如已安装 Millennium，也可改为 output_path = "auto" 实现构建时自动安装到 Steam。
output_path = "dist/com.steammarket.batchlister.star"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix  = "MKT-BCK"
frontend_prefix = "MKT-FRT"
webview_prefix  = "MKT-WEB"
